<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d12" />
    <meta name="description" content="Codex 额度重置与重置卡发放记录" />
    <title>Codex 重置监控</title>
    <script>
      ;(() => {
        try {
          const preference = localStorage.getItem('codex-reset-theme') || 'system'
          const theme = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-D7l_0eFC.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DKM0F0uy.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
